name: Docker Image CI

on:
  push:
    branches: ["main"]

env:
  DOCKER_HUB_USER: ${{ github.repository_owner }}
  DOCKER_IMAGE_TAG: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: git fetch --unshallow

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10

      - run: pnpm install

      - run: pnpm build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag $DOCKER_IMAGE_TAG:$(git rev-parse --abbrev-ref HEAD)

      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_TAG:$(git rev-parse --abbrev-ref HEAD)
